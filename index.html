<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B6CB0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Speak English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg">
<title>Speak English - Advanced</title>
<style>
:root{--bg:#F4F7FB;--card:#fff;--ink:#1A2433;--mut:#5C6B7F;--pri:#2B6CB0;--ok:#2F9E6B;--bad:#C0392B;--line:#DCE4EE}
@media(prefers-color-scheme:dark){:root{--bg:#0F1620;--card:#18222F;--ink:#EAF0F7;--mut:#9AABC0;--pri:#5BA3E8;--ok:#4CC38A;--bad:#F0776B;--line:#2A3646}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:24px;margin:8px 0 2px}h2{font-size:20px;margin:6px 0}h3{font-size:13px;color:var(--mut);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.sub,.tip{color:var(--mut);margin:0 0 12px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap}.stats{display:flex;justify-content:space-between;color:var(--mut);font-size:14px}
button{font:inherit;border:0;border-radius:14px;padding:13px 16px;background:var(--pri);color:#fff;font-weight:600;min-height:48px;cursor:pointer}
button.alt{background:transparent;color:var(--pri);border:2px solid var(--pri)}button.big{width:100%;font-size:17px}button:disabled{opacity:.5}
.opt{width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);margin-bottom:8px;font-weight:500}
.opt.ok{border-color:var(--ok);background:rgba(47,158,107,.15)}.opt.no{border-color:var(--bad);background:rgba(192,57,43,.12)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:17px}
.tile.done{background:var(--ok);color:#fff;border-color:var(--ok)}.tile.now{border:2px solid var(--pri)}
.ph{font-size:19px;line-height:1.35;margin:4px 0 12px;font-weight:600}.ph.hit{color:var(--ok)}
.lbl{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase}.plain{text-decoration:line-through;color:var(--mut);font-size:16px;margin:2px 0 10px}
.fb{font-size:14px;color:var(--mut);margin:10px 0 0;min-height:18px}
.back{background:none;color:var(--pri);padding:8px 0;min-height:40px}.nav{display:flex;gap:10px;margin-top:14px}.nav button{flex:1}
.steps{display:flex;gap:6px;margin:10px 0 14px}.steps b{flex:1;text-align:center;padding:8px 4px;border-radius:10px;background:var(--line);font-size:13px}.steps b.on{background:var(--pri);color:#fff}
.timer{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* [theme, plain, polished, wrong, right, speaking prompt] */
const D=[
["Precise words","The movie was very good.","The movie was gripping from start to finish.","He is more smarter than me.","He is smarter than me.","Describe a movie you loved and why."],
["Strong verbs","I got a new job.","I secured a new position.","I am agree with you.","I agree with you.","Tell me about your job."],
["Articles: a, an, the","I am not expert.","I'm not an expert, but I'm learning.","She gave me an advice.","She gave me some advice.","Explain what you do at work."],
["Prepositions","I like cooking a lot.","I'm passionate about cooking.","I'm interested on music.","I'm interested in music.","Talk about a hobby you're passionate about."],
["Present perfect","I study this for two years now.","I've been studying this for two years.","I live here since 2015.","I've lived here since 2015.","Describe something you've done for years."],
["Indirect questions","Where is the mall? Tell me.","Could you tell me where the mall is?","Do you know where is the station?","Do you know where the station is?","Ask a stranger for directions, politely."],
["Polite requests","Give me the report.","Could you possibly send me the report today?","Please to send me the report.","Please send me the report.","Ask a coworker for a favor."],
["Giving reasons","I was late because traffic.","I was late because of heavy traffic.","I was late because the traffic heavy.","I was late because the traffic was heavy.","Explain why you were late for something."],
["Countable or not","I have many work.","I have a lot of work.","I have many informations.","I have a lot of information.","Describe your busiest day."],
["Review: yourself","I am a hard worker.","I take pride in working hard and learning fast.","I am work in sales.","I work in sales.","Introduce yourself with confidence."],
["Linking ideas","I like it. It is cheap.","I like it, and it's affordable too.","Although it is cheap, but it is good.","Although it is cheap, it is good.","Compare two things you own."],
["However / but","It's good but expensive.","It's good; however, it's quite expensive.","I like it, however it's expensive.","I like it; however, it's expensive.","Give one pro and one con of your city."],
["Giving examples","I like fruits like mango.","I enjoy tropical fruit, mangoes in particular.","I like fruits, for example mango, banana, etc.","I like fruit, for example mango and banana.","Tell me about a food you love, with examples."],
["Sequencing","First I wake up then I eat.","I start my day with coffee; after that, I plan my tasks.","After that I will went home.","After that I went home.","Walk me through your morning."],
["Cause and effect","I was tired so I slept.","I was exhausted, so I turned in early.","Because I was tired, so I slept.","Because I was tired, I slept.","Tell about a time you were very tired."],
["Reported speech","He said I'm late.","He told me I was late.","He said me to wait.","He told me to wait.","Retell a conversation you had."],
["If I won...","If I will have time, I go.","If I have time, I'll join you.","If I would win, I would travel.","If I won, I would travel.","What would you do if you won a big prize?"],
["Giving advice","You must rest.","You might want to get some rest.","You should to rest more.","You should rest more.","Give advice to a stressed friend."],
["Clarifying","What?","Sorry, could you clarify what you mean?","Can you explain me this?","Can you explain this to me?","Explain a difficult idea simply."],
["Review: storytelling","I went to the mall. It was fun.","I went to the mall on a whim, and it turned out to be fun.","Yesterday I go to mall.","Yesterday I went to the mall.","Tell a short story from last week."],
["Softening opinions","You are wrong.","I see it a little differently.","In my opinion, I think that it is good.","In my opinion, it is good.","Give your opinion on remote work."],
["Persuading","Buy this. It's good.","This is worth it because it saves you time.","It will help to save your time.","It will save you time.","Convince me to try something new."],
["Hedging","It is true.","It's likely true, though I can't be certain.","Maybe probably it will rain.","It will probably rain.","Make a prediction about next year."],
["Natural word pairs","I did a mistake.","I made a mistake, and I'll fix it.","I did a mistake.","I made a mistake.","Describe a mistake you learned from."],
["Natural expressions","I'm very busy.","I'm swamped at the moment.","I'm very much busy.","I'm very busy.","Describe a stressful week using two new expressions."],
["Polite feedback","Your work is bad.","This is a solid start; a few parts could be stronger.","I suggest to add more examples.","I suggest adding more examples.","Give feedback on a presentation."],
["Disagreeing politely","No, that's wrong.","I understand your point, but I'd argue otherwise.","I'm not agree.","I don't agree.","Disagree politely with a friend."],
["Summarizing","Many things happened.","To sum up, three things stood out.","Finally, as a conclusion, it was good.","In conclusion, it was good.","Summarize your week in three points."],
["Emotion words","I'm very happy.","I'm thrilled, and it's a huge relief.","I'm feeling very much excited.","I'm really excited.","Describe a moment you felt proud."],
["Final challenge","Thank you for helping me.","I truly appreciate your help; it made a real difference.","I'm so grateful for you help.","I'm so grateful for your help.","In 90 seconds: what does learning English mean to you?"]];
/* Personal coach: real sentences from our chat -> better versions */
const F=[
["Make it more harder.","Make it harder.","Never combine \"more\" with an -er word."],
["I wan to practice speaking in English.","I want to practice speaking English.","Say \"speak English\", not \"speak in English\"."],
["Putting the every word on its place.","Putting every word in its proper place.","No \"the\" before \"every\". Say \"in place\"."],
["As I'm not expert.","As I'm not an expert.","Jobs and roles need a/an."],
["Don't make it exaggerated or sounds expert.","Don't make it sound exaggerated or expert.","Keep the verb pattern parallel."],
["Make it you basis.","Use it as your basis.","\"You\" is a person. \"Your\" shows belonging."],
["Add my image.","Add my photo.","A \"photo\" of a person; an \"image\" is more general."],
["Make it pdf.","Make it a PDF.","Add \"a\" before a file type."],
["Help me to be more expressive, and articulate.","Help me become more expressive and articulate.","No comma between two joined adjectives."]];
const PARTS=["Part 1 - Precision","Part 2 - Flow","Part 3 - Persuasion"],SECS=[45,60,90];
const $=s=>document.querySelector(s),app=$("#app"),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let S={done:[],streak:0,last:"",slow:false};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("se30adv")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("se30adv",JSON.stringify(S))}catch(e){}};
const norm=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g,"").split(/\s+/).filter(Boolean);
const q=t=>t.replace(/"/g,"&quot;");
let rec=null,tm=null;
function stop(){try{rec&&rec.stop()}catch(e){}clearInterval(tm);speechSynthesis&&speechSynthesis.cancel()}
function say(t){if(!("speechSynthesis" in window))return alert("Audio not supported here.");speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=S.slow?.6:.9;speechSynthesis.speak(u)}
function say2(b){say(b.dataset.t)}
function check(b){const fb=b.parentNode.parentNode.querySelector(".fb"),ph=b.parentNode.parentNode.querySelector(".ph"),t=b.dataset.t;
 fb.textContent="Listening... speak now";const r=new SR();r.lang="en-US";rec=r;
 r.onresult=e=>{const h=e.results[0][0].transcript,tw=norm(t),sw=norm(h),pc=Math.round(tw.filter(w=>sw.includes(w)).length/tw.length*100);
  ph.classList.toggle("hit",pc>=80);fb.textContent=(pc>=80?"Excellent! ":"Try again. ")+pc+"% match. I heard: \""+h+"\""};
 r.onerror=e=>fb.textContent=e.error==="not-allowed"?"Please allow microphone access.":"Could not hear you. Try again.";
 try{r.start()}catch(e){}}
function sayCard(t,label){return `<div class="card"><div class="lbl">${label}</div><p class="ph">${t}</p><div class="row"><button data-t="${q(t)}" onclick="say2(this)">🔊 Listen</button>${SR?`<button class="alt" data-t="${q(t)}" onclick="check(this)">🎤 Say it</button>`:""}</div><p class="fb"></p></div>`}
function home(){stop();
 const n=S.done.length,nx=Math.min(30,(D.findIndex((_,i)=>!S.done.includes(i))+1)||30);
 let h=`<h1>Speak English: Advanced</h1><p class="sub">Say it clearly. Say it precisely. Say it well.</p>
 <div class="card"><div class="stats"><span><b>${n}</b> / 30 days</span><span>🔥 ${S.streak} day streak</span></div><div class="bar"><i style="width:${n/30*100}%"></i></div>
 <button class="big" onclick="day(${nx-1},0)">${n?"Continue":"Start"} Day ${nx}</button></div>
 <div class="card"><b>🎯 My Coach Notes</b><p class="tip" style="margin:6px 0 10px">Drills built from your own sentences in our chat.</p><button class="big alt" onclick="fixes(0)">Practice my fixes</button></div>`;
 PARTS.forEach((p,pi)=>{h+=`<h3>${p} (${SECS[pi]}s talks)</h3><div class="grid">`;
  for(let i=pi*10;i<pi*10+10;i++)h+=`<button class="tile ${S.done.includes(i)?"done":""} ${i==nx-1&&!S.done.includes(i)?"now":""}" onclick="day(${i},0)" aria-label="Day ${i+1}">${S.done.includes(i)?"✓":i+1}</button>`;h+="</div>"});
 app.innerHTML=h;scrollTo(0,0)}
function fixes(i){stop();const f=F[i];
 let h=`<button class="back" onclick="home()">← Home</button><h2>My Fixes ${i+1}/${F.length}</h2>
 <div class="card"><div class="lbl">You wrote</div><p class="plain" style="text-decoration:none;color:var(--bad)">${f[0]}</p><div class="lbl">Better</div><p class="ph">${f[1]}</p><p class="tip">${f[2]}</p>
 <div class="row"><button data-t="${q(f[1])}" onclick="say2(this)">🔊 Listen</button>${SR?`<button class="alt" data-t="${q(f[1])}" onclick="check(this)">🎤 Say it</button>`:""}</div><p class="fb"></p></div>
 <div class="card"><b>Your strengths</b><p class="tip">Your messages are clear, direct, and polite. You say exactly what you need. The small slips repeat in a few patterns (articles, small words, parallel structure), so they are easy to fix with practice. This is based on our chat only.</p></div>
 <div class="nav">${i>0?`<button class="alt" onclick="fixes(${i-1})">← Back</button>`:""}${i<F.length-1?`<button onclick="fixes(${i+1})">Next →</button>`:`<button onclick="home()">Done</button>`}</div>`;
 app.innerHTML=h;scrollTo(0,0)}
function day(d,s){stop();const x=D[d];
 let h=`<button class="back" onclick="home()">← All days</button><p class="sub" style="margin:0">Day ${d+1} of 30</p><h2>${x[0]}</h2>
 <div class="steps">${["1 Upgrade","2 Fix it","3 Speak"].map((t,i)=>`<b class="${i==s?"on":""}">${t}</b>`).join("")}</div>
 <div class="row" style="margin-bottom:12px"><button class="alt" style="flex:1;padding:8px;min-height:40px" onclick="S.slow=!S.slow;save();day(${d},${s})">Speed: ${S.slow?"Slow":"Normal"}</button></div>`;
 if(s==0)h+=`<p class="tip">Say the polished version aloud. Notice the word choice.</p><div class="card"><div class="lbl">Basic</div><p class="plain">${x[1]}</p></div>${sayCard(x[2],"Polished")}`;
 if(s==1){const sw=d%2,o=sw?[x[4],x[3]]:[x[3],x[4]];
  h+=`<p class="tip">Which sentence is correct?</p>`+o.map(t=>`<button class="opt" onclick="pick(this,${t==x[4]})">${t}</button>`).join("")+`<div id="rs" style="display:none">${sayCard(x[4],"Now say the correct one")}</div>`}
 if(s==2)h+=`<div class="card"><div class="lbl">Speaking prompt (${SECS[Math.floor(d/10)]} seconds)</div><p class="ph">${x[5]}</p><p class="tip">Use: <b>Point</b>, then <b>Reason</b>, then <b>Example</b>. Use one linking word (however, because, for example).</p><div class="timer" id="tm">${SECS[Math.floor(d/10)]}</div><button class="big" id="go" onclick="talk(${d})">▶ Start speaking</button><p class="fb" id="rp"></p></div>`;
 h+=`<div class="nav">${s>0?`<button class="alt" onclick="day(${d},${s-1})">← Back</button>`:""}${s<2?`<button onclick="day(${d},${s+1})">Next →</button>`:`<button ${S.done.includes(d)?"disabled":""} onclick="fin(${d})">${S.done.includes(d)?"✓ Completed":"Complete day"}</button>`}</div>`;
 app.innerHTML=h;scrollTo(0,0)}
function pick(b,ok){b.classList.add(ok?"ok":"no");if(ok){document.querySelectorAll(".opt").forEach(o=>o.disabled=true);$("#rs").style.display="block"}else b.disabled=true}
function talk(d){stop();let t=SECS[Math.floor(d/10)],tot=t,txt="";const go=$("#go"),rp=$("#rp");go.disabled=true;rp.textContent=SR?"Listening...":"Speak out loud. Record yourself to listen back.";
 const end=()=>{clearInterval(tm);try{rec&&rec.stop()}catch(e){}go.disabled=false;go.textContent="↻ Try again";
  if(!SR){rp.textContent="Time's up! Great effort. Try recording yourself with your phone's voice recorder and listen back.";return}
  const w=norm(txt),fil=(txt.toLowerCase().match(/\b(um|uh|erm|like|you know|basically|actually)\b/g)||[]).length,wpm=Math.round(w.length/(tot/60));
  rp.innerHTML=`<b>${w.length} words</b> | <b>${wpm} words/min</b> (aim for 110-150) | <b>${fil} filler words</b> (aim for under 3).<br>${w.length<15?"I could hear very little. Check your microphone and try again.":wpm<90?"Try to keep going without long pauses. Short sentences are fine.":fil>3?"Good pace! Replace fillers with a short pause.":"Strong delivery! Try again with a new linking word."}`};
 if(SR){rec=new SR();rec.lang="en-US";rec.continuous=true;rec.interimResults=false;rec.onresult=e=>{txt="";for(const r of e.results)txt+=r[0].transcript+" "};rec.onend=()=>{if(t>0)try{rec.start()}catch(e){}};try{rec.start()}catch(e){}}
 tm=setInterval(()=>{t--;$("#tm").textContent=t;if(t<=0)end()},1000)}
function fin(d){if(!S.done.includes(d))S.done.push(d);const T=new Date().toDateString(),Y=new Date(Date.now()-864e5).toDateString();
 if(S.last!==T){S.streak=S.last===Y?S.streak+1:1;S.last=T}save();S.done.length===30?(alert("Congratulations! You finished all 30 days! 🎉"),home()):home()}
home();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
